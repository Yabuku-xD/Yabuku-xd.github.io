    <script>
      (function () {
        var np = document.querySelector("#spotify-now-playing");
        var rp = document.querySelector("#spotify-recently-played");

        function el(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text != null) node.textContent = text;
          return node;
        }

        function httpUrl(url) {
          try {
            var u = new URL(url);
            if (u.protocol === "https:" || u.protocol === "http:") return u.href;
          } catch (e) {}
          return "";
        }


        function renderNowPlaying(data) {
          var link = el(
            "a",
            "flex items-center gap-4 hover:opacity-80 transition-opacity group",
          );
          var href = httpUrl(data.songUrl);
          if (href) {
            link.href = href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
          }
          var img = el(
            "img",
            "w-16 h-16 flex-shrink-0 rounded object-cover group-hover:scale-105 transition-transform",
          );
          img.decoding = "async";
          img.loading = "lazy";
          img.width = 64;
          img.height = 64;
          img.alt = "";
          var src = httpUrl(data.albumArt);
          if (src) img.src = src;
          var meta = el("div", "min-w-0");
          meta.append(
            el(
              "div",
              "text-sm font-medium text-foreground truncate",
              data.title,
            ),
          );
          var row = el(
            "div",
            "flex items-center gap-2 text-xs text-secondary truncate mt-0.5",
          );
          row.append(el("span", null, data.artist));
          if (data.isPlaying) {
            var indicator = el(
              "span",
              "inline-flex items-center gap-1.5 text-xs text-emerald-600",
            );
            indicator.append(
              el("span", "w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"),
            );
            var label = el("span", null, "now playing");
            label.style.animation = "blink 1.8s ease-in-out infinite";
            indicator.append(label);
            row.append(indicator);
          } else {
            row.append(el("span", "text-xs text-secondary", "last played"));
          }
          meta.append(row);
          link.append(img, meta);
          np.replaceChildren(link);
        }

        function renderRecentlyPlayed(tracks) {
          var frag = document.createDocumentFragment();
          tracks.slice(0, 8).forEach(function (t) {
            var link = el(
              "a",
              "flex items-center gap-3 py-2.5 hover:opacity-80 transition-opacity",
            );
            var href = httpUrl(t.url);
            if (href) {
              link.href = href;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
            }
            var img = el(
              "img",
              "w-10 h-10 flex-shrink-0 rounded object-cover",
            );
            img.decoding = "async";
            img.loading = "lazy";
            img.width = 40;
            img.height = 40;
            img.alt = "";
            var src = httpUrl(t.albumArt);
            if (src) img.src = src;
            var meta = el("div", "min-w-0 flex-1");
            meta.append(
              el("div", "text-sm text-foreground truncate", t.name),
              el("div", "text-xs text-secondary truncate mt-0.5", t.artist),
            );
            link.append(img, meta);
            frag.append(
              link,
              el("div", "border-b border-border border-dashed"),
            );
          });
          rp.replaceChildren(frag);
        }

        function fail(id, msg) {
          var node = document.querySelector("#" + id);
          node.replaceChildren(el("div", "text-sm text-secondary", msg));
        }

        async function loadSpotifyData() {
          try {
            var [topArtists, topTracks, nowPlaying, recentlyPlayed] =
              await Promise.all([
                fetch("/api/spotify/top-artists?range=short_term").then(
                  function (r) {
                    return r.ok ? r.json() : null;
                  },
                ),
                fetch("/api/spotify/top-tracks?range=short_term").then(
                  function (r) {
                    return r.ok ? r.json() : null;
                  },
                ),
                fetch("/api/spotify/now-playing").then(function (r) {
                  return r.ok ? r.json() : null;
                }),
                fetch("/api/spotify/recently-played").then(function (r) {
                  return r.ok ? r.json() : null;
                }),
              ]);

            if (nowPlaying) renderNowPlaying(nowPlaying);
            else fail("spotify-now-playing", "couldn't load now playing.");

            if (recentlyPlayed && recentlyPlayed.length)
              renderRecentlyPlayed(recentlyPlayed);
            else fail("spotify-recently-played", "no recent data.");
          } catch (e) {
            fail("spotify-now-playing", "spotify unavailable right now.");
            fail("spotify-recently-played", "");
          }
        }

        loadSpotifyData();
      })();
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var revealEls = Array.prototype.slice.call(
          document.querySelectorAll(".reveal"),
        );
        var reducedMotion =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (reducedMotion || !("IntersectionObserver" in window)) {
          revealEls.forEach(function (el) {
            el.classList.add("visible");
          });
          return;
        }

        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1, rootMargin: "0px 0px -50px 0px" },
        );

        revealEls.forEach(function (el) {
          observer.observe(el);
        });
      });
    </script>
