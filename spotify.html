    <script>
      (function () {
        var np = document.getElementById("spotify-now-playing");
        var rp = document.getElementById("spotify-recently-played");

        function msToMin(ms) {
          var m = Math.floor(ms / 60000);
          var s = Math.floor((ms % 60000) / 1000);
          return m + ":" + (s < 10 ? "0" : "") + s;
        }

        function renderNowPlaying(data) {
          var indicator = data.isPlaying
            ? '<span class="inline-flex items-center gap-1.5 text-xs text-emerald-600"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span><span style="animation:blink 1.8s ease-in-out infinite">now playing</span></span>'
            : '<span class="text-xs text-secondary">last played</span>';
          np.innerHTML =
            '<a href="' +
            data.songUrl +
            '" target="_blank" rel="noopener noreferrer" class="flex items-center gap-4 hover:opacity-80 transition-opacity group">' +
            '<img decoding="async" src="' +
            data.albumArt +
            '" alt="" width="64" height="64" class="w-16 h-16 flex-shrink-0 rounded object-cover group-hover:scale-105 transition-transform" loading="lazy" />' +
            '<div class="min-w-0"><div class="text-sm font-medium text-foreground truncate">' +
            esc(data.title) +
            "</div>" +
            '<div class="flex items-center gap-2 text-xs text-secondary truncate mt-0.5"><span>' +
            esc(data.artist) +
            "</span>" +
            indicator +
            "</div></div></a>";
        }

        function renderRecentlyPlayed(tracks) {
          var h = "";
          tracks.slice(0, 8).forEach(function (t) {
            h +=
              '<a href="' +
              t.url +
              '" target="_blank" rel="noopener noreferrer" class="flex items-center gap-3 py-2.5 hover:opacity-80 transition-opacity">' +
              '<img decoding="async" src="' +
              t.albumArt +
              '" alt="" width="40" height="40" class="w-10 h-10 flex-shrink-0 rounded object-cover" loading="lazy" />' +
              '<div class="min-w-0 flex-1"><div class="text-sm text-foreground truncate">' +
              esc(t.name) +
              "</div>" +
              '<div class="text-xs text-secondary truncate mt-0.5">' +
              esc(t.artist) +
              "</div></div></a>" +
              '<div class="border-b border-border border-dashed"></div>';
          });
          rp.innerHTML = h;
        }

        function esc(s) {
          return s
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        function fail(id, msg) {
          document.getElementById(id).innerHTML =
            '<div class="text-sm text-secondary">' + msg + "</div>";
        }

        async function loadSpotifyData() {
          try {
            var [topArtists, topTracks, nowPlaying, recentlyPlayed] =
              await Promise.all([
                fetch("/api/spotify/top-artists?range=short_term").then(
                  function (r) {
                    return r.ok ? r.json() : null;
                  },
                ),
                fetch("/api/spotify/top-tracks?range=short_term").then(
                  function (r) {
                    return r.ok ? r.json() : null;
                  },
                ),
                fetch("/api/spotify/now-playing").then(function (r) {
                  return r.ok ? r.json() : null;
                }),
                fetch("/api/spotify/recently-played").then(function (r) {
                  return r.ok ? r.json() : null;
                }),
              ]);

            if (nowPlaying) renderNowPlaying(nowPlaying);
            else fail("spotify-now-playing", "couldn't load now playing.");

            if (recentlyPlayed && recentlyPlayed.length)
              renderRecentlyPlayed(recentlyPlayed);
            else fail("spotify-recently-played", "no recent data.");
          } catch (e) {
            fail("spotify-now-playing", "spotify unavailable right now.");
            fail("spotify-recently-played", "");
          }
        }

        loadSpotifyData();
      })();
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var revealEls = Array.prototype.slice.call(
          document.querySelectorAll(".reveal"),
        );
        var reducedMotion =
          window.matchMedia &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (reducedMotion || !("IntersectionObserver" in window)) {
          revealEls.forEach(function (el) {
            el.classList.add("visible");
          });
          return;
        }

        var observer = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.1, rootMargin: "0px 0px -50px 0px" },
        );

        revealEls.forEach(function (el) {
          observer.observe(el);
        });
      });
    </script>
